name: Data due this month

# The calendar for the hand-run datasets. On the 1st of each month this reads
# `nextDue` from src/data/_registry.ts and opens "Data due this month — <Month
# YYYY>" listing every manual dataset due within 45 days with its exact command
# and source link: the DVLA theft FOI (request in September for the year's
# data), the DVSA MOT bulk drop (~May), and the curated files. No issue when
# nothing is due. The same list is `npx tsx scripts/data-due.ts` locally.

on:
  schedule:
    - cron: '0 7 1 * *' # 1st of the month, 07:00 UTC
  workflow_dispatch:
    inputs:
      window_days:
        description: "How far ahead to look (days)"
        default: "45"

permissions:
  contents: read
  issues: write

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: What is due
        id: due
        run: |
          DAYS="${{ inputs.window_days || '45' }}"
          npx tsx scripts/data-due.ts --days "$DAYS" --markdown > due.md
          npx tsx scripts/data-due.ts --days "$DAYS"
          if head -1 due.md | grep -q NOTHING_DUE; then
            echo "due=false" >> $GITHUB_OUTPUT
          else
            echo "due=true" >> $GITHUB_OUTPUT
          fi
          cat due.md >> $GITHUB_STEP_SUMMARY

      - name: Open or update the issue
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Data due this month — $(date -u +'%B %Y')"
          gh label create data-due --force --color 0E8A16 --description "A hand-run dataset is due" >/dev/null 2>&1 || true
          NUM=$(gh issue list --state open --label data-due --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file due.md >/dev/null
            echo "updated #$NUM"
          else
            gh issue create --title "$TITLE" --label data-due --body-file due.md
          fi
