name: Social Clips

# Every third Saturday night: render the next three weeks' clips (nine) from
# the site's own data (social/, a Remotion project) and publish them as a
# GitHub release tagged social-<first ISO week>, with the posters and one
# captions.json. The Sunday-morning "clips are ready" email
# (/api/cron/social-clips, via src/lib/social-clips.ts) reads the latest such
# release through the public API and lists the clips with their captions, so
# the founder can queue the whole batch in Buffer in half an hour; the Friday
# audit shows the same section. Nothing here posts to a social network.
#
# Why batches of three: Buffer's free plan queues ten posts per channel, and
# three weeks is nine, queued on a Sunday when the previous batch has all
# gone out. The cron fires every Saturday; `npm run batch` (social/src/cli/
# batch.ts) says whether the coming week opens a batch (every third week from
# 2026-W45), and on the other two Saturdays the job stops after that check.
# `workflow_dispatch` takes a `week` and renders the batch starting there
# whatever the calendar says (deterministic, so a re-run replaces the
# release's assets with identical clips).
#
# Budget: nine clips take about 90 s on an M-series Mac and are expected to
# take 10–15 minutes on the runner (two cores); the render step is capped at
# 25 minutes so a stuck browser can't eat the hour. Nothing is committed, so
# there is no PR and no CI run to approve.

on:
  schedule:
    - cron: '0 22 * * 6' # Saturdays at 22:00 UTC; renders only on batch Saturdays
  workflow_dispatch:
    inputs:
      week:
        description: 'First ISO week of the batch to render, e.g. 2026-W48 (default: the week starting next Monday, only if it opens a batch)'
        required: false
        type: string

permissions:
  contents: write # creates the release and uploads its assets

concurrency:
  group: social-clips
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: social/package-lock.json

      # Chrome Headless Shell's shared libraries (remotion.dev/docs/miscellaneous/linux-dependencies).
      - name: Install browser libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 \
            libpango-1.0-0 libatk-bridge2.0-0

      - name: Install the renderer
        run: npm ci --prefix social --no-audit --no-fund

      - name: Fetch Chrome Headless Shell
        run: npm --prefix social exec -- remotion browser ensure

      - name: Check the calendar and pickers
        run: npm run social:check

      # Which weeks, and whether to render at all. A dispatch with a week
      # always renders; the schedule renders only when the coming week opens
      # a batch.
      - name: Decide the batch
        id: decide
        run: |
          WEEK_FLAG=""
          if [ -n "${{ inputs.week }}" ]; then WEEK_FLAG="--week ${{ inputs.week }}"; fi
          OUT=$(npm --prefix social run --silent batch -- $WEEK_FLAG)
          echo "$OUT"
          echo "batch=$(echo "$OUT" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).batch')" >> $GITHUB_OUTPUT
          echo "first=$(echo "$OUT" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).first')" >> $GITHUB_OUTPUT
          echo "last=$(echo "$OUT" | node -pe 'const w=JSON.parse(require("fs").readFileSync(0,"utf8")).weeks; w[w.length-1]')" >> $GITHUB_OUTPUT

      - name: Render the batch
        id: render
        if: steps.decide.outputs.batch == 'true'
        timeout-minutes: 25
        env:
          ANALYTICS_WRITES: '0'
        run: |
          npm run social:render -- --out social/out/current --week ${{ steps.decide.outputs.first }} --weeks 3
          WEEK=$(node -e "console.log(require('./social/out/current/captions.json').week)")
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          ls -la social/out/current

      - name: Publish the release
        if: steps.decide.outputs.batch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.render.outputs.week }}
          LAST: ${{ steps.decide.outputs.last }}
        run: |
          TAG="social-$WEEK"
          {
            echo "Nine clips for the three weeks from Monday $(node -e "console.log(require('./social/out/current/captions.json').monday)") ($WEEK to $LAST), rendered from the site's data by the Saturday job."
            echo
            node -e "
              const c = require('./social/out/current/captions.json');
              for (const x of c.clips) console.log('- ' + x.week + ' **' + x.day + '** (' + x.audience + '): ' + x.title + ' — \`' + x.file + '\`');
            "
            echo
            echo "captions.json carries each clip's caption and UTM links; the Sunday email and the Friday audit list them."
          } > /tmp/notes.md
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
            gh release upload "$TAG" --clobber social/out/current/*.mp4 social/out/current/*.png social/out/current/captions.json
          else
            gh release create "$TAG" --title "Social clips $WEEK to $LAST" --notes-file /tmp/notes.md \
              social/out/current/*.mp4 social/out/current/*.png social/out/current/captions.json
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Social clips — ${{ steps.render.outputs.week || 'not rendered' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.decide.outputs.batch }}" != "true" ]; then
            echo "ℹ️ ${{ steps.decide.outputs.first }} does not open a batch (batches start every third week from 2026-W45); nothing rendered. Next batch: run by hand with that week, or wait." >> $GITHUB_STEP_SUMMARY
          elif [ -f social/out/current/captions.json ]; then
            echo "| week | day | audience | title | file |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./social/out/current/captions.json');
              for (const x of c.clips) console.log('| ' + x.week + ' | ' + x.day + ' | ' + x.audience + ' | ' + x.title + ' | ' + x.file + ' |');
            " >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release: https://github.com/${{ github.repository }}/releases/tag/social-${{ steps.render.outputs.week }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ The render did not produce captions.json — check the render step." >> $GITHUB_STEP_SUMMARY
          fi
