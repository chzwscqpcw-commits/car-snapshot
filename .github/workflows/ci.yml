name: CI

# Lightweight checks on every push / PR to main. Vercel handles the full
# production build on push; this gate catches type regressions and report
# rendering regressions (the valuation headline + km→miles conversion) before
# they ship. The PDF smoke-test is dependency-free — it asserts on jsPDF's
# uncompressed output buffer, so no poppler/browser is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Hard gate: the lint backlog (309 errors) has been cleared, so any new
      # ESLint error fails the build.
      - name: Lint
        run: npm run lint

      # `npm test`, not `npm run test:pdf`. CI ran the PDF smoke-test alone, so
      # test:valuation and test:historic were never a gate — and on 2026-09-02
      # that let a real mispricing reach production: the weekly scrape added a
      # petrol VAUXHALL CORSA row, a latent bug in lookupNewPrice handed every
      # electric Corsa that cheaper price, and test:valuation caught it locally
      # while CI stayed green. Thirteen EV models were wrong for four days.
      #
      # Both suites are dependency-free and run in seconds, so there was never a
      # cost reason to leave them out.
      - name: Test suite
        run: npm test

  # Drives a real browser through every way a plate enters the site (#174):
  # hero search, direct and legacy links, the homepage, booking, MOT
  # reminders and the carVertical hand-off — and fails if any request to our
  # server carries the plate in its URL. Runs against a production build with
  # no secrets: /api/lookup is answered from a fixture and every off-site
  # request is blocked, so it makes no real lookups and no partner clicks.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-

      # `next build`, not `npm run build`: the prebuild step refreshes data
      # from the network, which this check doesn't need and shouldn't depend on.
      - name: Build
        run: npx next build

      - name: Start server
        run: |
          npx next start -p 3123 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3123/ && exit 0; sleep 1; done
          cat next.log; exit 1

      - name: Plate-flow test
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
