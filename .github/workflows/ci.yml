name: CI

# Lightweight checks on every push / PR to main. Vercel handles the full
# production build on push; this gate catches type regressions and report
# rendering regressions (the valuation headline + km→miles conversion) before
# they ship. The PDF smoke-test is dependency-free — it asserts on jsPDF's
# uncompressed output buffer, so no poppler/browser is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Non-blocking for now: the repo carries ~309 pre-existing ESLint errors,
      # so this surfaces lint output in the run without failing the build. Flip
      # to a hard gate (drop continue-on-error) once that count is driven to zero.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: PDF report smoke-test
        run: npm run test:pdf
