name: New-Car Price & EV Spec Refresh

# The two slow scrapers, split out of refresh-data.yml.
#
# WHY THEY LIVE HERE. Parkers was added to the weekly refresh on 2026-05-20 and
# broke it immediately: it needs far longer than that job's ceiling, so every
# run from 05-24 to 08-09 was killed mid-scrape, before the commit step. Twelve
# weeks of perfectly good recalls/VCA/NCAP data was scraped and thrown away,
# and recalls sat frozen at 20 May while the site served it as current.
#
# Parkers has never once completed in CI — it managed ~475 review pages in
# 11m53s at CONCURRENCY=2 with a 400ms inter-request delay, and the sitemap is
# far larger than that. It is not a 20-minute job and no amount of capping
# makes it one. So: its own workflow, its own hour, its own commit. If it
# overruns even this, it costs nothing but its own freshness.
#
# Runs Wednesday rather than Sunday so it cannot race the weekly refresh for
# the same push.

on:
  schedule:
    - cron: '0 4 * * 3' # Wednesdays at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # opens + auto-merges the data PR (main is protected)
  actions: write # approves this PR's own held CI run

env:
  CHROME_PATH: /usr/bin/google-chrome-stable

jobs:
  prices:
    runs-on: ubuntu-latest
    # Generous by design. The scrapers below are individually capped, so this
    # is an outer bound, not a target.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so build-freshness-manifest.ts can `git log`

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome present
        run: |
          ${{ env.CHROME_PATH }} --version
          echo "OK"

      - name: Refresh new-car list prices (Parkers)
        id: parkers
        # The scraper is now incremental and stops itself at --budget-minutes,
        # so it should never reach this cap; the cap is a backstop for a hung
        # browser, not the mechanism. 45m budget vs a measured ~53 pages/min
        # over ~1,800 pages ≈ a full pass most weeks, and a clean partial when
        # the site is slow. Either way it WRITES what it got.
        timeout-minutes: 55
        continue-on-error: true
        run: npx tsx scripts/fetch-new-prices.ts --budget-minutes=45

      - name: Refresh EV specs (ev-database.org)
        id: evspecs
        # ev-database.org rate-limits aggressively; repeated HTTP 429s can make
        # this fail outright. Never fatal — we ship whatever Parkers produced.
        #
        # The old 10-minute cap could never work: a full pass is ~1,400 pages at
        # a measured ~79 pages/min, so every run was killed mid-scrape and, with
        # the old write-at-the-end design, produced nothing at all for 194 days.
        # 15m budget inside a 20m cap now covers a full pass most weeks, and
        # 429-throttled URLs are left unmarked so the next run retries them.
        timeout-minutes: 20
        continue-on-error: true
        run: npx tsx scripts/fetch-ev-specs.ts --budget-minutes=15

      # Make a hollow run impossible to miss.
      #
      # Both scrapers are continue-on-error, which is right — a Parkers failure
      # should not throw away good EV data. But it also meant this workflow
      # reported SUCCESS every Wednesday from 19 August while both scrapers
      # timed out and committed nothing. Green is what let it rot unnoticed for
      # 194 days, and the run summary that recorded the truth is a page nobody
      # opens unprompted.
      #
      # So: one scraper down is a warning (the other still refreshed); BOTH
      # down means the run achieved literally nothing and goes red, because a
      # red run is the only signal that actually reaches anyone.
      - name: Surface scraper failures
        if: always()
        run: |
          P="${{ steps.parkers.outcome }}"
          E="${{ steps.evspecs.outcome }}"
          echo "Parkers=$P  EV specs=$E"
          [ "$P" != "success" ] && echo "::warning title=Parkers scrape failed::outcome=$P — new-prices.json keeps its previous values"
          [ "$E" != "success" ] && echo "::warning title=EV spec scrape failed::outcome=$E — ev-specs.json keeps its previous values"
          if [ "$P" != "success" ] && [ "$E" != "success" ]; then
            echo "::error title=Price refresh achieved nothing::both scrapers failed; no data was refreshed this run"
            exit 1
          fi
          exit 0

      # Gates the commit exactly as the weekly refresh does: a partial or
      # failed scrape may cost freshness, but must never push bad data.
      - name: Validate all data
        run: npx tsx scripts/validate-data.ts

      - name: Check for changes
        id: changes
        run: |
          # The scrape-state files are committed on purpose: CI runners are
          # ephemeral, so state is the only way a run knows which slice the
          # previous one covered. Without it the scrapers restart from scratch
          # every week and never converge.
          DATA_FILES="src/data/new-prices.json src/data/ev-specs.json scripts/scrape-state"
          if git diff --quiet $DATA_FILES; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No price/spec changes — nothing to commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat $DATA_FILES
          fi

      - name: Rebuild freshness manifest
        if: steps.changes.outputs.changed == 'true'
        run: npx tsx scripts/build-freshness-manifest.ts

      # main is branch-protected and requires the `checks` status, so a direct
      # push is rejected with GH006 however good the scrape was. Commit to a
      # branch and let auto-merge land it once CI passes. See the long note in
      # refresh-data.yml for why this isn't solved with an admin PAT.
      - name: Open auto-merging data PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data-prices/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/new-prices.json src/data/ev-specs.json src/data/_freshness.json scripts/scrape-state
          git commit -m "data: refresh new-car prices & EV specs"
          git push origin "$BRANCH"
          gh pr create \
            --title "data: refresh new-car prices & EV specs" \
            --body "Automated Parkers/EV scrape. Merges itself once \`checks\` passes.

          | source | outcome |
          |---|---|
          | Parkers new-car prices | ${{ steps.parkers.outcome }} |
          | EV specs | ${{ steps.evspecs.outcome }} |

          A \`failure\` above means that dataset kept its previous values. See
          run ${{ github.run_id }}." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash --delete-branch

      # See the long note in refresh-data.yml: GitHub holds CI runs on
      # bot-authored PRs as `action_required`, so without this the PR sits open
      # forever waiting on a human.
      - name: Approve own CI run
        id: approve
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data-prices/${{ github.run_id }}"
          for i in $(seq 1 15); do
            RID=$(gh run list --workflow=ci.yml --branch "$BRANCH" --limit 1 \
                    --json databaseId -q '.[0].databaseId // empty')
            STATE=$(gh run list --workflow=ci.yml --branch "$BRANCH" --limit 1 \
                    --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion // "-")"')
            if [ -n "$RID" ]; then
              echo "CI run $RID is $STATE"
              case "$STATE" in
                *action_required*)
                  gh api -X POST "repos/${{ github.repository }}/actions/runs/$RID/approve" \
                    && echo "approved=true" >> $GITHUB_OUTPUT \
                    && exit 0
                  echo "self-approval refused by GitHub — needs a human"
                  echo "approved=false" >> $GITHUB_OUTPUT
                  exit 0
                  ;;
                queued/*|in_progress/*|completed/success)
                  echo "no approval needed"
                  echo "approved=n/a" >> $GITHUB_OUTPUT
                  exit 0
                  ;;
              esac
            fi
            sleep 6
          done
          echo "no CI run appeared for $BRANCH within 90s"
          echo "approved=absent" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          echo "## New-Car Price & EV Spec Refresh — Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ Data changed. Commit pushed; Vercel will deploy." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes this run." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          # Both scrapers are continue-on-error, so a green job proves nothing
          # on its own. Print the outcomes.
          echo "### Scraper outcomes" >> $GITHUB_STEP_SUMMARY
          echo "| source | outcome |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Parkers new-car prices | ${{ steps.parkers.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EV specs | ${{ steps.evspecs.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current entry counts" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          node -e "
            const fs=require('fs');
            for (const f of ['new-prices.json','ev-specs.json']) {
              const d=JSON.parse(fs.readFileSync('src/data/'+f,'utf-8'));
              const count = Array.isArray(d) ? d.length : Object.keys(d).length;
              console.log(f.padEnd(22)+' '+count.toLocaleString()+' entries');
            }
          " >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
