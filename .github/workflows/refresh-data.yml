name: Weekly Data Refresh

# Weekly puppeteer-based refresh of the three agency data sources that
# need a real browser to scrape past Imperva / Next.js / JS rendering:
#   - DVSA recalls
#   - VCA fuel economy (full 2000-2026 archive)
#   - Euro NCAP crash ratings
#
# Direct-commits to main on changes (Vercel auto-deploys on push). For
# data sanity, validates the full dataset before pushing — if validation
# fails the workflow exits non-zero and no commit happens.

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  # ubuntu-latest ships with Chrome pre-installed at this path; our
  # puppeteer scripts pick it up via CHROME_PATH.
  CHROME_PATH: /usr/bin/google-chrome-stable

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full git history so build-freshness-manifest.ts can `git log`

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome present
        run: |
          ${{ env.CHROME_PATH }} --version
          echo "OK"

      - name: Refresh DVSA recalls
        run: npx tsx scripts/fetch-recalls.ts

      - name: Refresh VCA fuel economy archive
        run: |
          npx tsx scripts/fetch-vca-archive.ts
          npx tsx scripts/process-fuel-data.ts vca-csvs/*.csv

      - name: Refresh Euro NCAP ratings
        run: npx tsx scripts/fetch-ncap-ratings.ts

      - name: Refresh new-car list prices (Parkers)
        run: npx tsx scripts/fetch-new-prices.ts

      - name: Refresh EV specs (ev-database.org)
        # ev-database.org rate-limits aggressively. If we get HTTP 429
        # repeatedly the script may fail outright — that's not fatal to the
        # weekly refresh; we ship whatever the other scrapers produced.
        continue-on-error: true
        run: npx tsx scripts/fetch-ev-specs.ts

      - name: Validate all data
        run: npx tsx scripts/validate-data.ts

      - name: Check for changes
        id: changes
        run: |
          DATA_FILES="src/data/recalls.json src/data/fuel-economy.json src/data/ncap-ratings.json src/data/new-prices.json src/data/ev-specs.json"
          if git diff --quiet $DATA_FILES; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes — nothing to commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat $DATA_FILES
          fi

      - name: Rebuild freshness manifest
        # Captures fresh timestamps for the just-modified files via git log
        # (full history is available because we cloned with fetch-depth: 0).
        # We commit the manifest alongside the data so Vercel's shallow-clone
        # rebuild has accurate freshness data without re-running git log.
        if: steps.changes.outputs.changed == 'true'
        run: npx tsx scripts/build-freshness-manifest.ts

      - name: Commit and push to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/recalls.json src/data/fuel-economy.json src/data/ncap-ratings.json src/data/new-prices.json src/data/ev-specs.json src/data/_freshness.json
          git commit -m "data: weekly auto-refresh"
          git push origin main

      - name: Summary
        if: always()
        run: |
          echo "## Weekly Data Refresh — Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ Data changed. Commit pushed; Vercel will deploy." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No data changes this week." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current entry counts" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          node -e "
            const fs=require('fs');
            for (const f of ['recalls.json','fuel-economy.json','ncap-ratings.json','new-prices.json','ev-specs.json']) {
              const d=JSON.parse(fs.readFileSync('src/data/'+f,'utf-8'));
              const count = Array.isArray(d) ? d.length : Object.keys(d).length;
              console.log(f.padEnd(22)+' '+count.toLocaleString()+' entries');
            }
          " >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
