name: Weekly Data Refresh

# Weekly puppeteer-based refresh of the three agency data sources that
# need a real browser to scrape past Imperva / Next.js / JS rendering:
#   - DVSA recalls
#   - VCA fuel economy (full 2000-2026 archive)
#   - Euro NCAP crash ratings
#
# Direct-commits to main on changes (Vercel auto-deploys on push). For
# data sanity, validates the full dataset before pushing — if validation
# fails the workflow exits non-zero and no commit happens.
#
# ── Why the scrapers are capped and non-fatal ────────────────────────────────
# Between 2026-05-24 and 2026-08-09 this workflow was cancelled twelve weeks
# running and committed nothing. The Parkers new-car-price scraper had been
# added to it on 05-20; recalls/VCA/NCAP kept scraping FINE each week, then
# Parkers ran past the 20-minute job ceiling and GitHub killed the job before
# "Commit and push" — so twelve weeks of good data was scraped and discarded,
# and recalls sat frozen at 20 May while the site presented it as current.
#
# Two rules came out of that, and both matter more than any single dataset:
#   1. No scraper may starve the commit. Every one is time-capped and
#      continue-on-error, so a slow or broken source costs only its own data.
#   2. Anything that can't finish inside this budget does not belong here.
#      Parkers has NEVER completed in CI (~475 pages in 11m53s at
#      CONCURRENCY=2); it now lives in refresh-prices.yml with a 60-minute
#      budget of its own.
# `Validate all data` still gates the commit, so partial refreshes can't push
# garbage — the failure mode we want is "less fresh", never "wrong".
#
# ── Why this opens a PR instead of pushing to main ───────────────────────────
# `main` is branch-protected and requires the `checks` status. A direct push
# from CI can't satisfy that, so `git push origin main` is rejected with GH006
# no matter how healthy the scrape was — a SECOND breakage hiding behind the
# timeout one, and the reason the old `data-refresh/*` branches exist: an
# earlier version pushed branches that nothing ever merged, so they sat
# orphaned for months.
#
# So: commit to a branch, open a PR, enable auto-merge. CI runs `checks` on the
# data change, GitHub merges it the moment that passes, and Vercel deploys off
# the merge. No PAT needed — an admin token would bypass protection (
# enforce_admins is false) but would expire silently one day and reintroduce
# exactly this class of invisible failure.

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # opens + auto-merges the data PR (main is protected)
  actions: write # approves this PR's own held CI run — see the note below

env:
  # ubuntu-latest ships with Chrome pre-installed at this path; our
  # puppeteer scripts pick it up via CHROME_PATH.
  CHROME_PATH: /usr/bin/google-chrome-stable

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Must exceed the SUM of the step caps below (5 + 6 + 12 = 23) plus setup
    # and commit, or a bad week reintroduces the exact bug this replaced: the
    # job dying before it can commit. 30 leaves ~5 minutes of genuine slack.
    # Raise this whenever a step cap goes up.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full git history so build-freshness-manifest.ts can `git log`

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome present
        run: |
          ${{ env.CHROME_PATH }} --version
          echo "OK"

      # Typical runtimes (measured): recalls ~14s, VCA ~37s, NCAP ~348-423s.
      # Caps are generous multiples — they exist to stop a hang, not to rush a
      # slow day. continue-on-error on all three so one dead source can never
      # cost the other two their commit; the Summary below reports what failed.
      - name: Refresh DVSA recalls
        id: recalls
        timeout-minutes: 5
        continue-on-error: true
        run: npx tsx scripts/fetch-recalls.ts

      - name: Refresh VCA fuel economy archive
        id: vca
        timeout-minutes: 6
        continue-on-error: true
        run: |
          npx tsx scripts/fetch-vca-archive.ts
          npx tsx scripts/process-fuel-data.ts vca-csvs/*.csv

      - name: Refresh Euro NCAP ratings
        id: ncap
        timeout-minutes: 12
        continue-on-error: true
        run: npx tsx scripts/fetch-ncap-ratings.ts

      - name: Validate all data
        run: npx tsx scripts/validate-data.ts

      - name: Check for changes
        id: changes
        run: |
          # Only the three this workflow refreshes. new-prices.json and
          # ev-specs.json belong to refresh-prices.yml — listing them here would
          # let this job commit whatever that one happened to leave behind.
          DATA_FILES="src/data/recalls.json src/data/fuel-economy.json src/data/ncap-ratings.json"
          if git diff --quiet $DATA_FILES; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes — nothing to commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat $DATA_FILES
          fi

      - name: Rebuild freshness manifest
        # Captures fresh timestamps for the just-modified files via git log
        # (full history is available because we cloned with fetch-depth: 0).
        # We commit the manifest alongside the data so Vercel's shallow-clone
        # rebuild has accurate freshness data without re-running git log.
        if: steps.changes.outputs.changed == 'true'
        run: npx tsx scripts/build-freshness-manifest.ts

      - name: Open auto-merging data PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data-refresh/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/recalls.json src/data/fuel-economy.json src/data/ncap-ratings.json src/data/_freshness.json
          git commit -m "data: weekly auto-refresh (recalls, fuel economy, NCAP)"
          git push origin "$BRANCH"
          gh pr create \
            --title "data: weekly auto-refresh (recalls, fuel economy, NCAP)" \
            --body "Automated weekly scrape. Merges itself once \`checks\` passes.

          | source | outcome |
          |---|---|
          | DVSA recalls | ${{ steps.recalls.outcome }} |
          | VCA fuel economy | ${{ steps.vca.outcome }} |
          | Euro NCAP | ${{ steps.ncap.outcome }} |

          Any \`failure\` above means that dataset kept its previous values — the
          others still refreshed. See run ${{ github.run_id }}." \
            --base main --head "$BRANCH"
          # Auto-merge rather than a blind `gh pr merge`: `checks` has to go
          # green on the data itself before this lands.
          gh pr merge "$BRANCH" --auto --squash --delete-branch

      # GitHub holds CI runs on bot-authored PRs as `action_required` pending
      # human approval. The required `checks` status therefore never reports,
      # auto-merge waits forever, and the PR sits open — which is exactly what
      # happened to the 2026-08-16 run: it opened correctly at 04:47 and was
      # still unmerged 38 hours later, found only by accident.
      #
      # Approving it here is what makes the refresh genuinely unattended.
      # NOT allowed to fail the job: if GitHub refuses self-approval, the PR is
      # still open and correct and a human can approve it — losing a week of
      # freshness, not the data. The outcome is printed to the summary either
      # way, because a silent "approved: no" is how this bit us the first time.
      - name: Approve own CI run
        id: approve
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data-refresh/${{ github.run_id }}"
          for i in $(seq 1 15); do
            RID=$(gh run list --workflow=ci.yml --branch "$BRANCH" --limit 1 \
                    --json databaseId,status,conclusion -q '.[0].databaseId // empty')
            STATE=$(gh run list --workflow=ci.yml --branch "$BRANCH" --limit 1 \
                    --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion // "-")"')
            if [ -n "$RID" ]; then
              echo "CI run $RID is $STATE"
              case "$STATE" in
                *action_required*)
                  gh api -X POST "repos/${{ github.repository }}/actions/runs/$RID/approve" \
                    && echo "approved=true" >> $GITHUB_OUTPUT \
                    && exit 0
                  echo "self-approval refused by GitHub — needs a human"
                  echo "approved=false" >> $GITHUB_OUTPUT
                  exit 0
                  ;;
                queued/*|in_progress/*|completed/success)
                  echo "no approval needed"
                  echo "approved=n/a" >> $GITHUB_OUTPUT
                  exit 0
                  ;;
              esac
            fi
            sleep 6
          done
          echo "no CI run appeared for $BRANCH within 90s"
          echo "approved=absent" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          echo "## Weekly Data Refresh — Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ Data changed. Commit pushed; Vercel will deploy." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No data changes this week." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          # Scrapers are continue-on-error, so the job goes green even when one
          # fails. Print each outcome or that becomes invisible — which is how
          # twelve weeks of nothing went unnoticed in the first place.
          echo "### Scraper outcomes" >> $GITHUB_STEP_SUMMARY
          echo "| source | outcome |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| DVSA recalls | ${{ steps.recalls.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VCA fuel economy | ${{ steps.vca.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Euro NCAP | ${{ steps.ncap.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # `approved=false` means the PR is open and waiting on a human. That
          # must be visible here, or it repeats the 2026-08-16 silence.
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "Self-approval of CI run: **${{ steps.approve.outputs.approved || 'unknown' }}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Current entry counts" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          node -e "
            const fs=require('fs');
            for (const f of ['recalls.json','fuel-economy.json','ncap-ratings.json','new-prices.json','ev-specs.json']) {
              const d=JSON.parse(fs.readFileSync('src/data/'+f,'utf-8'));
              const count = Array.isArray(d) ? d.length : Object.keys(d).length;
              console.log(f.padEnd(22)+' '+count.toLocaleString()+' entries');
            }
          " >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
