<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Free Plate Check — Platform Tour (cover)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --slate950:#020617; --slate900:#0f172a; --slate100:#f1f5f9; --slate300:#cbd5e1;
    --slate400:#94a3b8; --slate500:#64748b; --cyan:#22d3ee; --blue:#3b82f6; --cyan100:#cffafe;
    --emerald:#34d399; --ease:cubic-bezier(0.16,1,0.3,1);
    --sans:"Inter",Arial,Helvetica,sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04060c;overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .page{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .stage{position:relative;width:1080px;height:1920px;flex:none;background:var(--slate950);overflow:hidden;transform-origin:center center}
  .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 1120px 900px at 50% 16%, rgba(34,211,238,.20), rgba(34,211,238,.09) 30%, rgba(34,211,238,.02) 50%, transparent 64%),
               radial-gradient(ellipse 1260px 940px at 50% 112%, rgba(59,130,246,.12), rgba(59,130,246,.03) 40%, transparent 60%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:180px 180px}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 1100px 1520px at 50% 50%, transparent 56%, rgba(0,0,0,.55))}

  /* the grid-safe band: TikTok crops the cover taller-than-square on the profile
     grid and overlays the handle at the very bottom — keep ALL key text centred
     between the two guides. Toggle the guides off before capturing. */
  .guide{position:absolute;left:0;right:0;height:2px;background:rgba(239,68,68,.5);display:none}
  .guide.t{top:300px}.guide.b{bottom:520px}
  body.guides .guide{display:block}

  .wm{position:absolute;top:120px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:18px}
  .wm .bolt svg{height:60px;width:auto;display:block;filter:drop-shadow(0 0 12px rgba(34,211,238,.45))}
  .wm .name{font-weight:800;font-size:44px;color:var(--slate100);letter-spacing:-.01em}

  .centre{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 96px}

  .kick{font-size:32px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:700;
    margin-bottom:48px;text-shadow:0 0 18px rgba(34,211,238,.4)}

  .plate{position:relative;display:inline-flex;align-items:center;justify-content:center;
    padding:24px 52px;border-radius:24px;background:rgba(15,23,42,.6);border:3px solid rgba(34,211,238,.45);
    box-shadow:0 0 70px rgba(34,211,238,.25), inset 0 0 30px rgba(34,211,238,.06);margin-bottom:64px}
  .plate::before{content:"";position:absolute;left:50%;top:50%;width:620px;height:300px;transform:translate(-50%,-50%);
    z-index:-1;filter:blur(38px);background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(34,211,238,.30), transparent 65%)}
  .plate .reg{font-family:var(--mono);font-weight:700;font-size:104px;letter-spacing:.12em;color:var(--cyan100);
    text-shadow:0 0 40px rgba(34,211,238,.6)}

  h1{font-size:104px;line-height:1.04;font-weight:900;color:var(--slate100);letter-spacing:-.02em;
    text-shadow:0 4px 30px rgba(0,0,0,.6);max-width:900px}
  h1 .free{color:var(--emerald)}
  .sub{margin-top:40px;font-family:var(--mono);font-size:34px;letter-spacing:.04em;color:var(--slate400)}
  .sub b{color:var(--slate100);font-weight:700}

  .controls{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:10px;align-items:center;
    background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:999px;padding:8px 12px;font-size:14px;color:#cbd5e1;backdrop-filter:blur(8px)}
  .controls button{font:inherit;color:#cbd5e1;background:#1e293b;border:1px solid #334155;border-radius:999px;padding:6px 14px;cursor:pointer}
  .controls button:hover{background:#334155;color:#fff}
  .controls .hint{opacity:.7;max-width:230px;line-height:1.3}
</style>
</head>
<body>
  <div class="page">
    <div class="stage" id="stage">
      <div class="glow"></div><div class="grain"></div>

      <div class="wm">
        <span class="bolt"><svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs><linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs>
          <path d="M 15 0 L 5 17 L 12 17 L 10 32 L 19 15 L 12 15 Z" fill="url(#bolt)"/>
        </svg></span>
        <span class="name">Free Plate Check</span>
      </div>

      <div class="centre">
        <div class="kick">One number plate</div>
        <div class="plate"><span class="reg">VN23&nbsp;BCD</span></div>
        <h1>Everything a car's hiding&nbsp;— <span class="free">free</span></h1>
        <div class="sub">MOT &middot; mileage &middot; ULEZ &middot; value &middot; <b>no email</b></div>
      </div>

      <div class="guide t"></div><div class="guide b"></div>
      <div class="vignette"></div>
    </div>
  </div>

  <div class="controls">
    <button id="guideBtn">Guides</button>
    <button id="scaleBtn">Fit</button>
    <button id="rec">Rec 1080</button>
    <span class="hint">Capture the dark frame at <b>1080&times;1920</b>, upload via TikTok &ldquo;Edit cover &rarr; Upload&rdquo;. <b>Guides</b> = profile-grid crop band; turn off before capture.</span>
  </div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const stage=$('stage'); let mode='fit';
  function rescale(){
    const page=document.querySelector('.page');
    if(mode==='fit'){const s=Math.min(innerWidth/1080,innerHeight/1920)*0.97;stage.style.transformOrigin='center center';stage.style.transform='scale('+s+')';page.style.alignItems='center';page.style.justifyContent='center';page.style.overflow='hidden';}
    else if(mode==='rec'){stage.style.transformOrigin='top left';stage.style.transform='scale(1)';page.style.alignItems='flex-start';page.style.justifyContent='flex-start';page.style.overflow='hidden';}
    else{stage.style.transformOrigin='top left';stage.style.transform='scale(1)';page.style.alignItems='flex-start';page.style.justifyContent='flex-start';page.style.overflow='auto';}
  }
  $('guideBtn').onclick=function(){document.body.classList.toggle('guides');this.textContent=document.body.classList.contains('guides')?'Guides ✓':'Guides';};
  $('scaleBtn').onclick=function(){mode=mode==='fit'?'full':'fit';this.textContent=mode==='fit'?'Fit':'100%';$('rec').textContent='Rec 1080';rescale();};
  $('rec').onclick=function(){mode='rec';this.textContent='1080 ✓';$('scaleBtn').textContent='Fit';rescale();};
  addEventListener('resize',rescale);rescale();
})();
</script>
</body>
</html>
