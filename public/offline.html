<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Offline · Free Plate Check</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left)); box-sizing: border-box; }
  svg { width: 56px; height: 72px; filter: drop-shadow(0 0 16px rgba(34, 211, 238, 0.35)); }
  h1 { margin: 0; font-size: 22px; color: #fff; }
  p { margin: 0; max-width: 32ch; line-height: 1.5; color: #94a3b8; }
  button { margin-top: 8px; padding: 12px 22px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; color: #fff; background: linear-gradient(90deg, #06b6d4, #3b82f6); cursor: pointer; }
  button:focus-visible { outline: 2px solid #22d3ee; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 32" aria-hidden="true"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><path d="M15 0 5 17h7l-2 15 9-17h-7z" fill="url(#b)"/></svg>
  <h1>You're offline</h1>
  <p>Vehicle checks need a connection to the DVLA and MOT services. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
