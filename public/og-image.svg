<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#22d3ee" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <g transform="translate(120, 215) scale(7)" filter="url(#glow)">
    <path d="M 15 0 L 5 17 L 12 17 L 10 32 L 19 15 L 12 15 Z" fill="url(#bolt)"/>
  </g>

  <text x="290" y="320" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="84" font-weight="800" fill="url(#text-grad)" letter-spacing="-2">Free Plate Check</text>
  <text x="290" y="375" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="28" font-weight="500" fill="#94a3b8">The free UK vehicle check — MOT, tax, valuation, ULEZ &amp; more</text>

  <text x="1130" y="600" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="end">freeplatecheck.co.uk</text>
</svg>
